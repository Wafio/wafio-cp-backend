# WAFio control plane configuration. Copy this file to config/config.yaml.
# Override any key with a WAFIO_* environment variable.

server:
  env: development
  http_addr: :9087
  agent_grpc_addr: 0.0.0.0:9090
  grpc_domain: ""
  base_url: http://localhost:5173
  cors_enabled: true
  cors_allow_origins: http://localhost:3000,http://localhost:5173
  cors_allow_methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  cors_allow_headers: Origin,Content-Type,Accept,Authorization
  cors_expose_headers: ""
  cors_allow_credentials: true
  cors_max_age_sec: 600
  security_headers_enabled: true
  rate_limit_enabled: true
  rate_limit_max: 120
  rate_limit_expiration_sec: 60
  rate_limit_auth_max: 30
  rate_limit_auth_expiration_sec: 60
  rate_limit_otp_max: 5
  rate_limit_otp_expiration_sec: 300
  rate_limit_read_max: 240
  rate_limit_read_expiration_sec: 60
  rate_limit_write_max: 120
  rate_limit_write_expiration_sec: 60
  rate_limit_register_max: 10
  rate_limit_register_expiration_sec: 300
  rate_limit_login_max: 20
  rate_limit_login_expiration_sec: 60
  # Host-key enrollment (POST /api/internal/host-enroll): failed requests per
  # source IP per window; past it the IP is refused before the argon2id
  # host-key check. Successful enrollments are not counted.
  rate_limit_enroll_max: 20
  rate_limit_enroll_expiration_sec: 600
  login_max_attempts: 5
  login_lock_minutes: 15
  # Reverse proxies allowed to name the client (IPs or CIDRs, at most 64, none
  # wider than an IPv4 /8 or IPv6 /16; 0.0.0.0/0 halts startup). Empty = none:
  # the TCP peer is the client. Behind nginx on the same host set
  # ["127.0.0.1", "::1"], otherwise every caller shares 127.0.0.1 for the
  # per-IP limiters, the login lockout and audit rows.
  # Env WAFIO_SERVER_TRUSTED_PROXIES (comma-separated). Restart to apply.
  trusted_proxies: []
  # Header a trusted proxy names the client in: X-Forwarded-For (walked from
  # the right past trusted proxies; nginx: proxy_set_header X-Forwarded-For
  # $proxy_add_x_forwarded_for) or X-Real-IP (nginx: proxy_set_header
  # X-Real-IP $remote_addr). Env WAFIO_SERVER_PROXY_HEADER.
  proxy_header: X-Forwarded-For
  # Agent gRPC receive budget (MiB/s; 0 = default). Every message an agent
  # stream sends is charged to the account owning the project: each account
  # gets up to agent_recv_account_mib_per_sec (burst one second of it), and
  # the accounts active at once share agent_recv_total_mib_per_sec fairly
  # (each at least total/active). The total must be at least the per-account
  # budget. Past it, streams wait; nothing is refused. Restart to apply.
  # Env WAFIO_SERVER_AGENT_RECV_ACCOUNT_MIB_PER_SEC, WAFIO_SERVER_AGENT_RECV_TOTAL_MIB_PER_SEC.
  agent_recv_account_mib_per_sec: 64
  agent_recv_total_mib_per_sec: 128
  # Path to the SvelteKit static frontend directory (for production bundle).
  # The control plane serves static files from this directory.
  # Default: "frontend" (relative to binary CWD in the production bundle)
  frontend_path: frontend

database:
  host: localhost
  port: 5432
  name: wafio
  user: postgres
  password: change-me
  sslmode: disable
  # Size of the shared pgx pool. One pool serves decision ingest, dashboard
  # queries, auth, and the eBPF and host paths, so pgx's own default of
  # max(4, NumCPU) lets a burst of WAF traffic starve the dashboard.
  # Keep the sum across every process pointed at this database below the
  # server's max_connections (default 100).
  max_conns: 20
  min_conns: 2
  # Server-side statement_timeout for every pooled connection, in ms.
  # A query that runs longer is cancelled. 0 = off; else 1000-600000.
  statement_timeout_ms: 15000

jwt:
  secret: CHANGE_ME_run_openssl_rand_hex_32   # REQUIRED: replace with `openssl rand -hex 32`; boot refuses this placeholder
  expire_hours: 72

# TOTP (2FA) secret encryption-at-rest.
# enc_key: 32-byte AES-256 key as 64 hex chars or base64. Generate with:
#   openssl rand -hex 32
# Required: boot refuses an empty or malformed key. KEEP THIS KEY STABLE AND BACKED UP — losing/changing it makes all
# encrypted TOTP secrets undecryptable, locking 2FA users out.
# Env: WAFIO_TOTP_ENC_KEY
totp:
  enc_key: ""

# Leave SMTP disabled until the operator supplies their own credentials.
# Never commit a working provider password to this example.
smtp:
  host: ""
  port: 587
  encryption: starttls
  username: ""
  password: ""
  from: "Wafio <noreply@example.com>"

mtls:
  cert_validity_days: 365
  server_cert_auto_renew: true
  server_cert_renew_before_days: 30
  # Warn (log + dashboard badge) when agent client certs expire within N days.
  cert_warn_before_days: 30

log:
  # debug | info (default) | warn | error. Sets the log/slog level; lines from
  # the standard log package are always written. Env WAFIO_LOG_LEVEL.
  level: info

geo:
  # Paths are set automatically after running `wafio fetch-data`.
  # Leave blank to use the defaults below (normalized names from fetch-data).
  country_db_path: security-data/geoip/country.mmdb
  city_db_path: security-data/geoip/city.mmdb
  asn_db_path: security-data/geoip/asn.mmdb
  # Optional: MaxMind GeoLite2 license key (free at maxmind.com/en/geolite2/signup).
  # If empty, DB-IP free databases are downloaded (no account required).
  maxmind_license_key: ""

bot_defaults:
  ua_bad_bot_file: security-data/user-agents/bot.txt
  ja3_blacklist_file: security-data/ja3/ja3.txt      # legacy, optional
  ja4_blacklist_file: security-data/ja4/ja4.txt
  ja4_allowlist_file: security-data/ja4/ja4_allowlist.txt
