# WAFio NGINX example
# Domain API : api.example.com
#
# Put the `upstream` and `server { ... }` blocks under the `http { ... }` context.
# The agent gRPC port (9090) is not proxied here: agents connect to it with mTLS.
#
# In WAFio config, set:
#   server.env: production
#   server.trusted_proxies: ["127.0.0.1", "::1"]   # this nginx (env WAFIO_SERVER_TRUSTED_PROXIES=127.0.0.1,::1)
#   server.proxy_header: X-Forwarded-For            # or X-Real-IP
# Without trusted_proxies every caller is 127.0.0.1 to the control plane:
# the per-IP limiters (login, OTP, recovery, enrollment, agent ingest) are
# shared by everyone and audit rows record 127.0.0.1. With it, the client is
# the rightmost X-Forwarded-For hop that is not a trusted proxy (nginx
# appends $remote_addr below, so a client-sent X-Forwarded-For cannot name
# another address), or X-Real-IP when proxy_header says so.

# -----------------------------
# HTTP (API) - inside http {}
# -----------------------------
upstream wafio_api_upstream {
    server 127.0.0.1:9087;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # Replace with your real certificate paths (e.g. Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_pass http://wafio_api_upstream;
    }
}
