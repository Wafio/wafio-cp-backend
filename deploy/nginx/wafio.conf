# WAFio NGINX example
# Domain API : api.wafio.cloud
# Domain TCP : tcp.wafio.cloud
#
# IMPORTANT:
# - Put `server { ... }` API blocks under `http { ... }` context.
# - Put `stream { ... }` block at top-level (outside http{}).
# - TCP mTLS is TLS PASSTHROUGH to WAFio TCP server (127.0.0.1:9089).
#
# In WAFio config, set:
#   server.env: production
#   server.tcp_domain: "tcp.wafio.cloud:9443"
#   server.trusted_proxies: ["127.0.0.1", "::1"]   # this nginx (env WAFIO_SERVER_TRUSTED_PROXIES=127.0.0.1,::1)
#   server.proxy_header: X-Forwarded-For            # or X-Real-IP
# Without trusted_proxies every caller is 127.0.0.1 to the control plane:
# the per-IP limiters (login, OTP, recovery, enrollment, agent ingest) are
# shared by everyone and audit rows record 127.0.0.1. With it, the client is
# the rightmost X-Forwarded-For hop that is not a trusted proxy (nginx
# appends $remote_addr below, so a client-sent X-Forwarded-For cannot name
# another address), or X-Real-IP when proxy_header says so.

# -----------------------------
# HTTP (API) - inside http {}
# -----------------------------
upstream wafio_api_upstream {
    server 127.0.0.1:9087;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.wafio.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.wafio.cloud;

    # Replace with your real certificate paths (e.g. Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.wafio.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wafio.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_pass http://wafio_api_upstream;
    }
}

# --------------------------------------------
# TCP mTLS passthrough - top-level stream {}
# --------------------------------------------
stream {
    upstream wafio_tcp_mtls_upstream {
        server 127.0.0.1:9089;
    }

    # Client will connect to: tcp.wafio.cloud:9443
    # TLS handshake is end-to-end between client and WAFio TCP server.
    server {
        listen 9443;
        listen [::]:9443;

        proxy_connect_timeout 5s;
        proxy_timeout 10m;
        proxy_pass wafio_tcp_mtls_upstream;

        # Optional: useful if later you want SNI-based routing in stream.
        ssl_preread on;
    }
}
