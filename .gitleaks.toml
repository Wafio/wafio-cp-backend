# gitleaks configuration (scripts/ci-local.sh, secret scan).
#
# Extends the default rule set. The only path allowlists are Go tests, which
# carry dummy tokens, and the API spec, which carries synthetic examples. A new
# secret anywhere else fails the scan.

title = "wafio-cp-backend"

[extend]
useDefault = true

[[allowlists]]
description = "Go tests (dummy tokens)"
paths = [
  '''_test\.go$''',
]

[[allowlists]]
description = "Synthetic JWT and API key examples in the API spec"
targetRules = ["jwt", "generic-api-key"]
paths = [
  '''^api/openapi\.yaml$''',
]
