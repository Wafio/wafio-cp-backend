# Advisory pass: reported, never blocking. See the note in .golangci.yml.
#
# The backlog is mostly gosec integer-conversion (G115) and file-path (G304)
# warnings, staticcheck findings and unused function parameters. Run the pass
# for current counts:
#   golangci-lint run -c .golangci-advisory.yml ./...
version: "2"

run:
  timeout: 10m

linters:
  enable:
    - errcheck
    - gosec
    - staticcheck
    - unparam
    - unused

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, unparam]
