name: ci

# The gate of scripts/ci-local.sh, on every push to main and every pull request.
# The database tests run against a TimescaleDB service that lives for the job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # A throwaway database: it exists for this job only and is reachable from the runner alone.
      db:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_DB: wafio_test
          POSTGRES_USER: wafio_test
          POSTGRES_PASSWORD: wafio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wafio_test -d wafio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum
      - name: Install gitleaks 8.30.1 and golangci-lint 2.13.1
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          curl -fsSL -o /tmp/golangci-lint.tgz https://github.com/golangci/golangci-lint/releases/download/v2.13.1/golangci-lint-2.13.1-linux-amd64.tar.gz
          echo "b17bfbc9d4aaa48be7f4f1ce3240bc3d8200c870c072bacf15c26219e2cfb9cc  /tmp/golangci-lint.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/golangci-lint.tgz -C /usr/local/bin --strip-components=1 golangci-lint-2.13.1-linux-amd64/golangci-lint
      # The WAFIO_DATABASE_* variables stay inside this step: set for the gate they would change what the
      # config tests read.
      - name: Migrate the test database and add the fixture project
        env:
          WAFIO_DATABASE_HOST: 127.0.0.1
          WAFIO_DATABASE_PORT: 5432
          WAFIO_DATABASE_NAME: wafio_test
          WAFIO_DATABASE_USER: wafio_test
          WAFIO_DATABASE_PASSWORD: wafio_test
          WAFIO_DATABASE_SSLMODE: disable
          PGPASSWORD: wafio_test
        run: |
          export WAFIO_JWT_SECRET="$(openssl rand -hex 32)" WAFIO_TOTP_ENC_KEY="$(openssl rand -base64 32)"
          go run ./cmd/wafio migrate up
          psql -h 127.0.0.1 -U wafio_test -d wafio_test -v ON_ERROR_STOP=1 <<'SQL'
          WITH u AS (
            INSERT INTO users(email, password_hash, name)
            VALUES ('fixture@wafio.test', 'not-a-login-hash', 'Integration Fixture') RETURNING id
          ) INSERT INTO projects(user_id, name, code)
            SELECT id, 'Integration Fixture', 'integration' FROM u;
          SQL
      - run: scripts/ci-local.sh
        env:
          TEST_DB_URL: postgres://wafio_test:wafio_test@127.0.0.1:5432/wafio_test?sslmode=disable
